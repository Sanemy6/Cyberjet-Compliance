<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <script>
    /* Préférences d'affichage appliquées avant le premier pixel. Les lire depuis
       le serveur suffirait, mais l'aller-retour se verrait : thème clair qui
       bascule en sombre, barre latérale qui se replie sous les yeux. Le serveur
       reste la source de vérité et corrige ce cache au chargement du shell. */
    (function () {
      var root = document.documentElement;
      var get = function (key, fallback) {
        try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
      };
      var theme = get('theme', 'auto');
      var dark = theme === 'dark'
        || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themePref = theme;
      root.dataset.accent = get('accent', 'azur');
      root.dataset.density = get('density', 'confort');
      root.dataset.motion = get('motion', 'full');
      root.dataset.rail = get('sidebar', 'expanded') === 'collapsed' ? '1' : '0';
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Cyberjet Compliance — Réponse aux questionnaires sécurité</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a6dd4'/><path d='M16 7l7 3v6c0 4.4-2.9 8.2-7 9.4-4.1-1.2-7-5-7-9.4v-6l7-3z' fill='white'/></svg>">
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim" hidden></div>

    <!-- ============================ Barre latérale ============================ -->
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <a class="brand" href="#/" data-tip="Cyberjet Compliance">
          <span class="brand-mark">
            <!-- Version blanche : la barre latérale est sombre dans les deux thèmes. -->
            <img src="/static/img/cyberjet-logo-white.png" alt="">
          </span>
          <span class="brand-text">
            <strong>Cyberjet</strong>
            <small>Compliance</small>
          </span>
        </a>
        <button class="rail-toggle" id="rail-toggle" type="button"
                aria-label="Réduire le menu" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg>
        </button>
      </div>

      <button class="side-search" id="side-search" type="button" data-tip="Recherche rapide">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <span class="ss-label">Rechercher…</span>
        <kbd class="ss-kbd">Ctrl K</kbd>
      </button>

      <nav class="nav" id="nav">
        <p class="nav-label">Pilotage</p>
        <a class="nav-item" href="#/" data-route="dashboard" data-tip="Tableau de bord">
          <svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8"/><path d="M5 10.5V20h14v-9.5"/></svg>
          <span class="ni-label">Tableau de bord</span>
        </a>
        <!-- Baguette, et non loupe : en mode réduit, l'icône de loupe serait
             indiscernable de celle de la recherche rapide juste au-dessus. -->
        <a class="nav-item" href="#/assistant" data-route="assistant" data-tip="Assistant réponse">
          <svg viewBox="0 0 24 24"><path d="M4 20 16.5 7.5"/><path d="M18 3.5 19 6l2.5 1L19 8l-1 2.5L17 8l-2.5-1L17 6Z"/><path d="M7 3.5 7.7 5 9 5.7 7.7 6.4 7 8l-.7-1.6L5 5.7 6.3 5Z"/></svg>
          <span class="ni-label">Assistant réponse</span>
        </a>

        <p class="nav-label">Dossiers</p>
        <a class="nav-item" href="#/clients" data-route="clients" data-tip="Clients">
          <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 20v-2a4 4 0 0 0-3-3.8"/><path d="M16 4.2a4 4 0 0 1 0 7.6"/></svg>
          <span class="ni-label">Clients</span>
        </a>
        <a class="nav-item" href="#/questionnaires" data-route="questionnaires" data-tip="Questionnaires">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
          <span class="ni-label">Questionnaires</span>
        </a>

        <p class="nav-label">Patrimoine</p>
        <a class="nav-item" href="#/kb" data-route="kb" data-tip="Base de connaissance">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"/><path d="M20 18v3H6.5A2.5 2.5 0 0 1 4 18.5"/></svg>
          <span class="ni-label">Base de connaissance</span>
        </a>
        <a class="nav-item" href="#/frameworks" data-route="frameworks" data-tip="Référentiels">
          <svg viewBox="0 0 24 24"><path d="M12 2.5 20 6v6.2c0 5-3.3 9.4-8 10.8-4.7-1.4-8-5.8-8-10.8V6l8-3.5Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
          <span class="ni-label">Référentiels</span>
        </a>
        <a class="nav-item" href="#/storage" data-route="storage" data-tip="Volumétrie">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M20 12c0 1.7-3.6 3-8 3s-8-1.3-8-3"/></svg>
          <span class="ni-label">Volumétrie</span>
        </a>

        <p class="nav-label" data-admin-only hidden>Administration</p>
        <a class="nav-item" href="#/users" data-route="users" data-admin-only hidden data-tip="Comptes">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 20v-1.3A4.7 4.7 0 0 1 8.2 14h1.6a4.7 4.7 0 0 1 4.7 4.7V20"/><path d="M17 8.5a2.8 2.8 0 1 1 0 5.6"/><path d="M20.5 20v-1c0-1.9-1.3-3.5-3.1-4"/></svg>
          <span class="ni-label">Comptes</span>
        </a>
        <a class="nav-item" href="#/audit" data-route="audit" data-admin-only hidden data-tip="Journal d’audit">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h3M9 17h6"/></svg>
          <span class="ni-label">Journal d’audit</span>
        </a>
      </nav>
    </aside>

    <!-- ================================ Contenu =============================== -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn burger" id="burger" type="button" aria-label="Ouvrir le menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <div class="crumb" id="crumb"></div>

        <div class="topbar-actions" id="topbar-actions"></div>

        <div class="topbar-tools">
          <button class="icon-btn" id="cmd-btn" type="button"
                  aria-label="Recherche rapide" data-tip="Recherche rapide · Ctrl K">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          </button>
          <button class="icon-btn" id="theme-btn" type="button"
                  aria-label="Changer de thème" data-tip="Thème">
            <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          </button>
          <button class="icon-btn" id="settings-btn" type="button"
                  aria-label="Paramètres du compte" data-tip="Paramètres">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
            <span class="tool-alert" id="mfa-alert" hidden
                  title="Vérification en deux étapes non activée"></span>
          </button>

          <div class="tool-sep"></div>

          <div class="user-menu">
            <button class="user-chip" id="user-chip" type="button">
              <span class="avatar" id="user-avatar">··</span>
              <span class="uc-text">
                <b id="user-name">…</b>
                <small id="user-role"></small>
              </span>
              <svg class="uc-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <div class="menu menu-user" id="user-menu" hidden>
              <div class="menu-id">
                <span class="avatar lg" id="menu-avatar">··</span>
                <div class="mi-text">
                  <b id="menu-name">…</b>
                  <small id="menu-mail">Aucune adresse associée</small>
                  <span class="badge" id="menu-role" style="margin-top:6px"></span>
                </div>
              </div>

              <div class="menu-sep"></div>

              <button class="menu-item" data-menu-close data-open="profil" type="button">
                <svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2.4"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5 16.5c.6-1.6 2-2.4 3.5-2.4s2.9.8 3.5 2.4"/><path d="M15 10h4M15 13.5h4"/></svg>
                <span>Ma fiche</span>
              </button>
              <button class="menu-item" data-menu-close data-open="securite" type="button">
                <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
                <span>Connexion &amp; sécurité</span>
                <span class="mi-state" id="menu-mfa"></span>
              </button>
              <button class="menu-item" data-menu-close data-open="apparence" type="button">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="14.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="13.5" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>
                <span>Apparence</span>
              </button>
              <button class="menu-item" data-menu-close data-open="sessions" type="button">
                <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="13" height="9.5" rx="1.8"/><path d="M6 18h6"/><rect x="17" y="9.5" width="4.5" height="9.5" rx="1.4"/></svg>
                <span>Appareils connectés</span>
              </button>

              <div class="menu-sep"></div>

              <button class="menu-item danger" id="btn-logout" data-menu-close type="button">
                <svg viewBox="0 0 24 24"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                <span>Se déconnecter</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="view" id="view">
        <div class="loader"><span class="spinner"></span></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="tip-root" class="tip" hidden></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>

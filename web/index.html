<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Conformité — Réponse aux questionnaires sécurité</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a6dd4'/><path d='M16 7l7 3v6c0 4.4-2.9 8.2-7 9.4-4.1-1.2-7-5-7-9.4v-6l7-3z' fill='white'/></svg>">
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim" hidden></div>

    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5 20 6v6.2c0 5-3.3 9.4-8 10.8-4.7-1.4-8-5.8-8-10.8V6l8-3.5Z" fill="currentColor" opacity=".18"/><path d="M12 2.5 20 6v6.2c0 5-3.3 9.4-8 10.8-4.7-1.4-8-5.8-8-10.8V6l8-3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8.6 12.2 2.4 2.4 4.6-4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text">
          <strong>Conformité</strong>
          <small>Questionnaires sécurité</small>
        </span>
      </a>

      <nav class="nav" id="nav">
        <p class="nav-label">Pilotage</p>
        <a class="nav-item" href="#/" data-route="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8"/><path d="M5 10.5V20h14v-9.5"/></svg>
          <span>Tableau de bord</span>
        </a>
        <a class="nav-item" href="#/assistant" data-route="assistant">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <span>Assistant réponse</span>
        </a>

        <p class="nav-label">Dossiers</p>
        <a class="nav-item" href="#/clients" data-route="clients">
          <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 20v-2a4 4 0 0 0-3-3.8"/><path d="M16 4.2a4 4 0 0 1 0 7.6"/></svg>
          <span>Clients</span>
        </a>
        <a class="nav-item" href="#/questionnaires" data-route="questionnaires">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
          <span>Questionnaires</span>
        </a>

        <p class="nav-label">Patrimoine</p>
        <a class="nav-item" href="#/kb" data-route="kb">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"/><path d="M20 18v3H6.5A2.5 2.5 0 0 1 4 18.5"/></svg>
          <span>Base de connaissance</span>
        </a>
        <a class="nav-item" href="#/frameworks" data-route="frameworks">
          <svg viewBox="0 0 24 24"><path d="M12 2.5 20 6v6.2c0 5-3.3 9.4-8 10.8-4.7-1.4-8-5.8-8-10.8V6l8-3.5Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
          <span>Référentiels</span>
        </a>
        <a class="nav-item" href="#/storage" data-route="storage">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M20 12c0 1.7-3.6 3-8 3s-8-1.3-8-3"/></svg>
          <span>Volumétrie</span>
        </a>

        <p class="nav-label">Mon compte</p>
        <a class="nav-item" href="#/security" data-route="security">
          <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
          <span>Sécurité</span>
          <span class="nav-alert" id="mfa-alert" hidden title="Vérification en deux étapes non activée">!</span>
        </a>

        <p class="nav-label" data-admin-only hidden>Administration</p>
        <a class="nav-item" href="#/users" data-route="users" data-admin-only hidden>
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 20v-1.3A4.7 4.7 0 0 1 8.2 14h1.6a4.7 4.7 0 0 1 4.7 4.7V20"/><path d="M17 8.5a2.8 2.8 0 1 1 0 5.6"/><path d="M20.5 20v-1c0-1.9-1.3-3.5-3.1-4"/></svg>
          <span>Comptes</span>
        </a>
        <a class="nav-item" href="#/audit" data-route="audit" data-admin-only hidden>
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h3M9 17h6"/></svg>
          <span>Journal d’audit</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-account" id="sidebar-account" hidden>
          <span class="sa-avatar" id="sa-avatar"></span>
          <span class="sa-name" id="sa-name"></span>
          <button class="icon-btn sm" id="btn-logout" type="button" title="Se déconnecter">
            <svg viewBox="0 0 24 24"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Changer de thème">
          <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <span class="theme-label">Thème</span>
        </button>
        <p class="sidebar-note">
          <span class="dot-live"></span> Traitement 100&nbsp;% local — aucune donnée ne quitte ce poste.
        </p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn burger" id="burger" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="view" id="view">
        <div class="loader"><span class="spinner"></span></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
